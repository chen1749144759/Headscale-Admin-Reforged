# Headscale Admin - Docker Compose 一键部署
# 启动: docker compose up -d
# 停止: docker compose down

services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:16-alpine
    container_name: hs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headscale_admin}
      POSTGRES_USER: ${POSTGRES_USER:-headscale_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HsAdmin2026PG}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-headscale_admin}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Headscale 控制服务器 (AE) ====================
  headscale:
    image: chenzeshi/headscale-admin-ae:${AE_VERSION:-latest}
    container_name: hs-headscale
    restart: unless-stopped
    volumes:
      - headscale-data:/var/lib/headscale
    ports:
      - "${HS_PORT:-8080}:8080"          # HTTP API + Noise 协议
      - "${HS_STUN_PORT:-3478}:3478/udp" # STUN (内嵌 DERP)
    environment:
      - HEADSCALE_SERVER_URL=${HEADSCALE_SERVER_URL:-http://127.0.0.1:8080}
      - HEADSCALE_DNS_DOMAIN=${HEADSCALE_DNS_DOMAIN:-hs.admin.pro}
      - HEADSCALE_LOG_LEVEL=${HEADSCALE_LOG_LEVEL:-info}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-headscale_admin}
      - DB_USER=${POSTGRES_USER:-headscale_admin}
      - DB_PASS=${POSTGRES_PASSWORD:-HsAdmin2026PG}
    entrypoint: ["/entrypoint.sh"]
    networks:
      - hs-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==================== 管理面板后端 (FastAPI) ====================
  admin-backend:
    image: chenzeshi/headscale-admin-backend:${BACKEND_VERSION:-latest}
    container_name: hs-admin-backend
    restart: unless-stopped
    environment:
      - HEADSCALE_URL=http://headscale:8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-headscale_admin}
      - DB_USER=${POSTGRES_USER:-headscale_admin}
      - DB_PASS=${POSTGRES_PASSWORD:-HsAdmin2026PG}
      - SECRET_KEY=${SECRET_KEY:-headscale-admin-secret-2026}
      - API_KEY_FILE=/data/headscale/api.key
    volumes:
      - headscale-data:/data/headscale:ro
    networks:
      - hs-net
    depends_on:
      headscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5175/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== Nginx 前端 + 反向代理 ====================
  nginx:
    image: chenzeshi/headscale-admin-nginx:${NGINX_VERSION:-latest}
    container_name: hs-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - hs-net
    depends_on:
      admin-backend:
        condition: service_healthy

volumes:
  postgres-data:
  headscale-data:

networks:
  hs-net:
    driver: bridge
