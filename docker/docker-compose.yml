x-backend-environment: &backend-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-headscale_admin}
  DB_USER: ${SCALEFORGE_DB_USER:-scaleforge_runtime}
  DB_PASS: ${SCALEFORGE_DB_PASSWORD:?Set SCALEFORGE_DB_PASSWORD in docker/.env}
  HEADSCALE_PUBLIC_URL: ${HEADSCALE_SERVER_URL:?Set HEADSCALE_SERVER_URL in docker/.env}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
  IP_GEOLOOKUP_URL: ${IP_GEOLOOKUP_URL:-}
  CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
  CAPTCHA_API_ENDPOINT: ${CAPTCHA_API_ENDPOINT:-}
  CAPTCHA_SITEVERIFY_URL: ${CAPTCHA_SITEVERIFY_URL:-}
  CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
  SCALEFORGE_INTERNAL_AUTH_KEY_FILE: /run/secrets/scaleforge_internal_auth_key

services:
  postgres:
    image: ${REGISTRY_MIRROR:-}postgres:16-alpine
    container_name: scaleforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headscale_admin}
      POSTGRES_USER: ${POSTGRES_USER:-headscale_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [scaleforge-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-headscale_admin} -d ${POSTGRES_DB:-headscale_admin}"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-bootstrap:
    image: ${REGISTRY_MIRROR:-}postgres:16-alpine
    container_name: scaleforge-db-bootstrap
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headscale_admin}
      POSTGRES_USER: ${POSTGRES_USER:-headscale_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      HEADSCALE_DB_USER: ${HEADSCALE_DB_USER:-headscale_runtime}
      HEADSCALE_DB_PASSWORD: ${HEADSCALE_DB_PASSWORD:?Set HEADSCALE_DB_PASSWORD in docker/.env}
      SCALEFORGE_DB_USER: ${SCALEFORGE_DB_USER:-scaleforge_runtime}
      SCALEFORGE_DB_PASSWORD: ${SCALEFORGE_DB_PASSWORD:?Set SCALEFORGE_DB_PASSWORD in docker/.env}
      SCALEFORGE_DB_OWNER: ${SCALEFORGE_DB_OWNER:-scaleforge_owner}
    volumes:
      - ./postgres/bootstrap.sh:/usr/local/bin/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/bootstrap.sh"]
    networks: [scaleforge-net]
    depends_on:
      postgres:
        condition: service_healthy

  headscale:
    image: ${REGISTRY_MIRROR:-}chenzeshi/headscale-admin-ae:${AE_VERSION:-latest}
    container_name: scaleforge-headscale
    restart: unless-stopped
    volumes:
      - headscale-data:/var/lib/headscale
      - headscale-config:/var/lib/headscale-config
      - headscale-cli-socket:/var/run/headscale
      - scaleforge-control-socket:/var/run/scaleforge/control
      - scaleforge-client-socket:/var/run/scaleforge/client
    secrets:
      - scaleforge_bootstrap_password
      - scaleforge_internal_auth_key
    ports:
      - "${HS_BIND_IP:-127.0.0.1}:${HS_PORT:-8080}:8080/tcp"
      - "${DERP_BIND_IP:-0.0.0.0}:${DERP_STUN_PORT:-3478}:3478/udp"
    environment:
      HEADSCALE_SERVER_URL: ${HEADSCALE_SERVER_URL:?Set the trusted HTTPS control URL in docker/.env}
      HEADSCALE_DNS_DOMAIN: ${HEADSCALE_DNS_DOMAIN:-hs.admin.pro}
      HEADSCALE_MAGIC_DNS: ${HEADSCALE_MAGIC_DNS:-true}
      HEADSCALE_DNS_OVERRIDE_LOCAL: ${HEADSCALE_DNS_OVERRIDE_LOCAL:-true}
      HEADSCALE_DNS_GLOBAL: ${HEADSCALE_DNS_GLOBAL:-1.1.1.1,8.8.8.8}
      HEADSCALE_DNS_SEARCH_DOMAINS: ${HEADSCALE_DNS_SEARCH_DOMAINS:-}
      HEADSCALE_CONFIG_OUT: /var/lib/headscale-config/config.yaml
      HEADSCALE_LOG_LEVEL: ${HEADSCALE_LOG_LEVEL:-info}
      HEADSCALE_TRUST_PROXY: ${HEADSCALE_TRUST_PROXY:-true}
      HEADSCALE_TRUSTED_PROXY_CIDRS: ${HEADSCALE_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      DERP_DOMAIN: ${DERP_DOMAIN:?Set DERP_DOMAIN in docker/.env}
      SCALEFORGE_BOOTSTRAP_USERNAME: ${SCALEFORGE_BOOTSTRAP_USERNAME:-admin}
      SCALEFORGE_MAX_NODES_PER_ACCOUNT: ${SCALEFORGE_MAX_NODES_PER_ACCOUNT:-20}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-headscale_admin}
      DB_USER: ${HEADSCALE_DB_USER:-headscale_runtime}
      DB_PASS: ${HEADSCALE_DB_PASSWORD:?Set HEADSCALE_DB_PASSWORD in docker/.env}
    group_add: ["10101"]
    networks: [scaleforge-net]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  scaleforge-migrate:
    image: ${REGISTRY_MIRROR:-}chenzeshi/scaleforge-backend:${BACKEND_VERSION:-latest}
    container_name: scaleforge-migrate
    restart: "no"
    command: ["python", "-m", "api.migrate"]
    environment:
      MIGRATION_DB_HOST: postgres
      MIGRATION_DB_PORT: "5432"
      MIGRATION_DB_NAME: ${POSTGRES_DB:-headscale_admin}
      MIGRATION_DB_USER: ${POSTGRES_USER:-headscale_admin}
      MIGRATION_DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      SCALEFORGE_DB_USER: ${SCALEFORGE_DB_USER:-scaleforge_runtime}
      SCALEFORGE_DB_OWNER: ${SCALEFORGE_DB_OWNER:-scaleforge_owner}
      HEADSCALE_DB_USER: ${HEADSCALE_DB_USER:-headscale_runtime}
      SCALEFORGE_MIGRATION_LOCK_TIMEOUT_MS: ${SCALEFORGE_MIGRATION_LOCK_TIMEOUT_MS:-15000}
      SCALEFORGE_MIGRATION_STATEMENT_TIMEOUT_MS: ${SCALEFORGE_MIGRATION_STATEMENT_TIMEOUT_MS:-300000}
    networks: [scaleforge-net]
    depends_on:
      headscale:
        condition: service_healthy

  admin-backend-public:
    image: ${REGISTRY_MIRROR:-}chenzeshi/scaleforge-backend:${BACKEND_VERSION:-latest}
    container_name: scaleforge-backend-public
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SCALEFORGE_APP: api.main:app
      SCALEFORGE_SOCKET: /var/run/scaleforge/public/api.sock
      SCALEFORGE_TRUST_PROXY: "true"
      HEADSCALE_SOCKET: /var/run/scaleforge/control/api.sock
    volumes:
      - scaleforge-control-socket:/var/run/scaleforge/control:ro
      - scaleforge-public-socket:/var/run/scaleforge/public
    secrets:
      - scaleforge_internal_auth_key
    networks: [scaleforge-net]
    depends_on:
      scaleforge-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/var/run/scaleforge/public/api.sock", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin-backend-client:
    image: ${REGISTRY_MIRROR:-}chenzeshi/scaleforge-backend:${BACKEND_VERSION:-latest}
    container_name: scaleforge-backend-client
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SCALEFORGE_APP: api.internal_main:app
      SCALEFORGE_SOCKET: /var/run/scaleforge/client/api.sock
      SCALEFORGE_TRUST_PROXY: "false"
    volumes:
      - scaleforge-client-socket:/var/run/scaleforge/client
    secrets:
      - scaleforge_internal_auth_key
    networks: [scaleforge-net]
    depends_on:
      scaleforge-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/var/run/scaleforge/client/api.sock", "http://localhost/internal/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: ${REGISTRY_MIRROR:-}chenzeshi/scaleforge-nginx:${NGINX_VERSION:-latest}
    container_name: scaleforge-nginx
    restart: unless-stopped
    environment:
      SCALEFORGE_EXTERNAL_SCHEME: ${SCALEFORGE_EXTERNAL_SCHEME:-https}
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-80}:80"
    group_add: ["10101"]
    volumes:
      - scaleforge-public-socket:/var/run/scaleforge/public:ro
    networks: [scaleforge-net]
    depends_on:
      admin-backend-public:
        condition: service_healthy

volumes:
  postgres-data:
  headscale-data:
  headscale-config:
  headscale-cli-socket:
  scaleforge-control-socket:
  scaleforge-client-socket:
  scaleforge-public-socket:

secrets:
  scaleforge_bootstrap_password:
    file: ./secrets/scaleforge_bootstrap_password
  scaleforge_internal_auth_key:
    file: ./secrets/scaleforge_internal_auth_key

networks:
  scaleforge-net:
    driver: bridge
