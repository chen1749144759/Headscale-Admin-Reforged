# Headscale Admin - Docker Compose 一键部署
# 启动: docker compose up -d
# 停止: docker compose down
#
# 国内用户无法访问 Docker Hub 时，在 .env 中设置:
#   REGISTRY_MIRROR=docker.1ms.run/
# 即可自动走镜像加速，无需修改本文件。

services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: ${REGISTRY_MIRROR:-}postgres:16-alpine
    container_name: hs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headscale_admin}
      POSTGRES_USER: ${POSTGRES_USER:-headscale_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HsAdmin2026PG}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-headscale_admin}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Headscale 控制服务器 (AE) ====================
  headscale:
    image: ${REGISTRY_MIRROR:-}chenzeshi/headscale-admin-ae:${AE_VERSION:-latest}
    container_name: hs-headscale
    restart: unless-stopped
    volumes:
      - headscale-data:/var/lib/headscale
      - derper-certs:/etc/headscale/derp-certs
      - ./config.yaml.tmpl:/etc/headscale/config.yaml.tmpl:ro
      - ./derp.yaml.tmpl:/etc/headscale/derp.yaml.tmpl:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "${HS_PORT:-8080}:8080"          # HTTP API + Noise 协议
    environment:
      - HEADSCALE_SERVER_URL=${HEADSCALE_SERVER_URL:-http://127.0.0.1:8080}
      - HEADSCALE_DNS_DOMAIN=${HEADSCALE_DNS_DOMAIN:-hs.admin.pro}
      - HEADSCALE_LOG_LEVEL=${HEADSCALE_LOG_LEVEL:-info}
      - DERP_DOMAIN=${DERP_DOMAIN:-}
      - DERP_STUN_PORT=${DERP_STUN_PORT:-3478}
      - DERP_HTTP_PORT=${DERP_HTTP_PORT:-3479}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-headscale_admin}
      - DB_USER=${POSTGRES_USER:-headscale_admin}
      - DB_PASS=${POSTGRES_PASSWORD:-HsAdmin2026PG}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - hs-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==================== DERP 中继服务器（独立部署） ====================
  derper:
    image: ${REGISTRY_MIRROR:-}fredliang/derper:latest
    container_name: hs-derper
    restart: unless-stopped
    ports:
      - "${DERP_STUN_PORT:-3478}:${DERP_STUN_PORT:-3478}/udp"   # STUN (UDP)
      - "${DERP_HTTP_PORT:-3479}:${DERP_HTTP_PORT:-3479}/tcp"    # DERP relay (TCP, TLS + 自签证书)
    volumes:
      - derper-certs:/app/certs:ro
    entrypoint:
      - /app/derper
      - --hostname=${DERP_DOMAIN:-127.0.0.1}
      - -a=:${DERP_HTTP_PORT:-3479}
      - --http-port=-1
      - --certmode=manual
      - --certdir=/app/certs
      - --stun-port=${DERP_STUN_PORT:-3478}
      - --verify-clients=true
    networks:
      - hs-net
    depends_on:
      headscale:
        condition: service_started

  # ==================== 管理面板后端 (FastAPI) ====================
  admin-backend:
    image: ${REGISTRY_MIRROR:-}chenzeshi/headscale-admin-backend:${BACKEND_VERSION:-latest}
    container_name: hs-admin-backend
    restart: unless-stopped
    environment:
      - HEADSCALE_URL=http://headscale:8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-headscale_admin}
      - DB_USER=${POSTGRES_USER:-headscale_admin}
      - DB_PASS=${POSTGRES_PASSWORD:-HsAdmin2026PG}
      - SECRET_KEY=${SECRET_KEY:-headscale-admin-secret-2026}
      - API_KEY_FILE=/data/headscale/api.key
    volumes:
      - headscale-data:/data/headscale:ro
    networks:
      - hs-net
    depends_on:
      headscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5175/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== Nginx 前端 + 反向代理 ====================
  nginx:
    image: ${REGISTRY_MIRROR:-}chenzeshi/headscale-admin-nginx:${NGINX_VERSION:-latest}
    container_name: hs-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - hs-net
    depends_on:
      admin-backend:
        condition: service_healthy

volumes:
  postgres-data:
  headscale-data:
  derper-certs:

networks:
  hs-net:
    driver: bridge
